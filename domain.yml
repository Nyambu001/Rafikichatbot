version: "3.1"

intents:
  - greet
  - goodbye
  - financial_struggles
  - academic_pressure
  - submit_assessment



entities:
  - support_dependents
  - financial_status
  - capital
  - income_source
  - institution
  - intensity
  - expense_type
  - debt

slots:
  expense_type:
    type: text
    mappings:
      - type: from_entity
        entity: expense_type
  financial_status:
    type: text
    mappings:
      - type: from_entity
        entity: financial_status
  support_dependents:
    type: text
    mappings:
      - type: from_entity
        entity: support_dependents
  capital:
    type: text
    mappings:
      - type: from_entity
        entity: capital
  debt:
    type: text
    mappings:
      - type: from_entity
        entity: debt
  intensity:
    type: text
    mappings:
      - type: from_entity
        entity: intensity
  income_source:
    type: text
    mappings:
      - type: from_entity
        entity: income_source
  institution:
    type: text
    mappings:
    - type: from_entity
      entity: institution



responses:
  utter_greet:
    - text: "Habari! Niko hapa kusaidia. Unahitaji msaada gani leo?"
    - text: "Vipi ndugu? Nafurahi kukuona. Je, kuna jambo lolote unataka kuzungumzia?"
    - text: "Mambo vipi? Ni vipi naweza kusaidia leo?"
    - text: "Shikamoo! Niko hapa, uko vipi?"

  utter_goodbye:
    - text: "Kwaheri! Usisahau kurudi tena."
    - text: "Tutaonana baadaye! Nenda salama."
    - text: "Kwaheri! Ninakutakia kila la heri."
    - text: "Tutaonana kesho, ni furaha yangu kukusaidia."

actions:
  - utter_greet
  - utter_goodbye
  - action_handle_assessment

