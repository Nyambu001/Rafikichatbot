  - intent: family_relationship_issues
    examples: |    
      - [wazazi wangu](family_relationship)
      - [ndugu yangu](family_relationship)
      - [dada yangu](family_relationship)
      - [baba yangu](family_relationship)
      - [mama yangu](family_relationship)
      - [kaka yangu](family_relationship)
      - [wazazi wetu](family_relationship)
      - [ndungu zangu](family_relationship)
      - [familia yangu](family_relationship)
      - [kifamilia](family_relationship)
      
      - Ninahisi shinikizo kwa sababu [wazazi wangu](family_relationship) [wanataka nifanye](family_expectations) kazi fulani ninayoichukia
      - Mara nyingi nahisi kama ninapaswa kutimiza [matarajio ya kifamilia](family_expectations) yasiyokuwa yangu
      - [Wazazi wangu](family_relationship) [wanatarajia niwe](family_expectations) na maisha bora zaidi yao na ninahisi mzigo
      - Kuna [shinikizo kubwa kutoka kwa familia yangu](family_expectations) kuhusu ndoa na watoto nisivyo taka
      - Kila mara ninasikia lawama kwa kushindwa kufikia [viwango wazazi walivyoweka](family_expectations) vyenye masharti
      - [Familia yangu](family_relationship) [inatarajia niwe](family_expectations) daktari baada ya kumaliza masomo yangu
      - Wazazi wangu [wanataka niwe](family_expectations) wa kwanza kupata shahada katika familia yetu
      - [Familia yangu](family_relationship) [inanitegemea kuchukua](family_expectations) biashara ya baba kama kazi yangu ya maisha
      - [Ndugu zangu](family_relationship) [wanalinganishwa nami](family_expectations) nami kila mara kuhusu mafanikio yao kitaaluma
      - [Familia yetu](family_relationship) [inaamini kuwa](family_expectations) mafanikio ya kweli ni kuwa na mali na magari makubwa
     
      - Kila mara [mimi na [kaka yangu](family_relationship) tunagombana](family_conflict) kuhusu urithi wa ardhi ya familia 
      - [Kuna mivutano mingi kati yangu na dada yangu](family_conflict) kwa sababu ya kutoelewana kuhusu majukumu ya nyumbani 
      - [Nimepoteza imani kwa baadhi ya ndugu zangu](family_conflict) kwa sababu walinidanganya kuhusu masuala ya kifamilia 
      - [Kuna chuki kubwa kwa sababu wazazi wetu wanapendelea kaka yetu](family_conflict) kuliko sisi wengine 
      - [Mahusiano yangu na ndugu zangu yameharibika](family_conflict) kwa sababu ya upendeleo unaoonyeshwa na wazazi wetu 
      - Migogoro inazidi kuongezeka kwa sababu [ndugu zangu hawaniheshimu tena](family_conflict) kama zamani 
      - [Kutoaminiana kati yangu na baba yangu](family_conflict) kumeharibu kabisa mawasiliano yetu 
      - [Kuna mvutano mkubwa kati yangu na wazazi wangu](family_conflict) kwa sababu hawaamini maamuzi ninayofanya kwa maisha yangu 

      - [Wazazi wangu walitalakiana](family_separation) nilipokuwa na umri mdogo, na tangu hapo [nimekua nikiishi mbali na baba yangu](family_separation)
      - Tangu [mama yangu ahamie nchi nyingine](family_separation), [tumekosa mawasiliano ya karibu kama familia](family_separation)
      - Baada ya [ugomvi mkubwa wa kifamilia](family_conflict), [ndugu yangu mkubwa aliacha kuwasiliana nasi](family_separation) kabisa
      - Najihisi [kutengwa na familia yangu](family_separation) kwa sababu hatuelewani tena kihisia kama zamani
      - [Baba yangu aliachana na mama yangu](family_separation) na akaanzisha familia mpya bila kutujulisha sisi watoto wake
      - [Kutengana na wazazi wangu](family_separation) kulifanya nikue nikijihisi sina sehemu ya kuitegemea
      - [Familia yetu iligawanyika](family_separation) baada ya migogoro ya kifamilia na kila mtu akaenda njia yake
      - [Ndugu zangu waliamua kuondoka nchini na sasa hatuna tena uhusiano wa karibu](family_separation)
      - [Hisia za kujitenga na familia yangu](family_separation) zimenifanya nihisi kuwa mgeni hata ninapokuwa nyumbani
      - Baada ya [wazazi wangu kuachana](family_separation), nililazimika kuishi na bibi na babu badala ya wazazi wangu
      
      - [Wazazi wangu wananiamulia kila jambo](family_control), kuanzia kazi ninayofanya hadi mtu ninayepaswa kuoana naye
      - Sina uhuru wa kufanya maamuzi kuhusu maisha yangu kwa sababu [kila kitu lazima kipitishwe na familia yangu](family_control)
      - [Familia yangu inanilazimisha](family_control) kushikilia mila na desturi ambazo siamini tena
      - Nahisi kufungwa [katika maisha niliyopangiwa na familia yangu](family_control) badala ya kuishi kwa mapenzi yangu mwenyewe
      - [Kila uamuzi kuhusu masomo yangu ulifanywa na wazazi wangu](family_control) bila kuniuliza maoni yangu
      - [Wazazi wangu hawakubali uchaguzi wangu](family_control) wa kazi kwa sababu wanataka nifanye kazi wanayoona inafaa
      - [Familia yangu inanizuia kuwa](family_control) na marafiki ninaowapenda kwa sababu hawawapendelei
      - [Familia yangu inanibana](family_control) kila mara, hata kuhusu mahali ninapoweza kuishi au watu ninaoweza kuwa nao karibu
      - Kila mara [ninalazimishwa kufuata mila na desturi za familia yetu](family_control) bila kuuliza maswali
      
      - Nilipokuwa nikihitaji msaada wa kihisia, [familia yangu haikuwahi kuwa pale](family_neglect) kwa ajili yangu
      - Nilipopitia changamoto shuleni, [hakuna mtu katika familia yangu aliyenisaidia au kunipa moyo](family_neglect)
      - Katika familia yetu, [hisia na matatizo ya watoto hayakupewa kipaumbele](family_neglect) kabisa
      - Wakati wa matatizo ya afya ya akili, [familia yangu ilichagua kuninyamazia](family_neglect) badala ya kunisaidia
      - [Familia yangu haikunisaidia wala kuniuliza hali yangu](family_neglect) hata wakati nilipokuwa nikihangaika na matatizo mazito
      - [Hakuna mtu katika familia yangu aliyewahi kuonyesha kujali](family_neglect) nilipopitia vipindi vya huzuni au kushindwa
      - Nilijifunza kushughulikia matatizo yangu peke yangu kwa sababu [sikuwa na mtu wa kunisaidia nyumbani](family_neglect)
      - Wakati mwingine [nahisi kama familia yangu ilinisahau kabisa](family_neglect), hata sikumbuki tukizungumza mambo yangu ya kibinafsi

  - intent: romantic_relationship_issues
    examples: |
      - [mpenzi wangu](romantic_relationship)
      - [uhusiano wa kimapenzi](romantic_relationship)
      - [uhusiano wetu wa kimapenzi](romantic_relationship)
      
      - [Nahisi mpenzi wangu ana mambo anayoficha](romantic_trust_and_jealousy) kwa sababu hawezi kunijibu maswali yangu kwa uwazi
      - Kila mara [ninahisi hofu kwamba mpenzi wangu anaweza kunisaliti](romantic_trust_and_jealousy) kwa sababu ya tabia zake za siri
      - [Ukosefu wa uaminifu kati yangu na mpenxi wangu](romantic_trust_and_jealousy) umesababisha mimi kuwa na mashaka kila mara anapochelewa kurudi nyumbani
      - [Ninapata wivu mkubwa ninapomuona mpenzi wangu](romantic_trust_and_jealousy) akizungumza na watu wengine wa jinsia tofauti
      - [Najihisi kuwa na wasiwasi kwa sababu mpenzi wangu haoneshi wazi dhamira yake ya kuwa mwaminifu kwangu](romantic_trust_and_jealousy)
      - [Kuna mashaka mengi kati yetu kwa sababu ya historia ya mpenzi wangu](romantic_trust_and_jealousy) ya kuwa na mahusiano ya zamani yaliyovunjika kwa usaliti

      - Kila ninapojaribu kuelezea hisia zangu, [mpenzi wangu anaonekana kutokuwa na hamu ya kunisikiliza](romantic_communication_issues)
      - Mawasiliano yetu kama wapenzi yamekuwa ya juu juu tu, [hatuzungumzi mambo ya kina wala mahitaji yetu ya kihisia](romantic_communication_issues)
      - Ninajihisi mpweke kwa sababu kila ninapotaka kuzungumza kuhusu matatizo yetu, [mpenzi wangu huchagua kunyamaza](romantic_communication_issues)
      - Tunapokuwa na matatizo, [badala ya kuzungumza, mpenzi wangu huamua kunipuuza](romantic_communication_issues) kwa siku kadhaa
      - Nahisi kama sauti yangu haina maana [katika uhusiano wa kimapenzi wetu kwa sababu mawazo yangu hayawezi kusikilizwa](romantic_communication_issues)
      - [Mimi na menzi wangu hatuwezi kuzungumza kwa utulivu bila kurushiana lawama na kulaumiana](romantic_communication_issues) hata kwenye mambo madogo
      - [Mpenzi wangu anaona aibu kuzungumza kuhusu hisia zake](romantic_communication_issues) na mara nyingi huficha maumivu yake

      - [Mimi na mpenzi wangu yumekuwa tukizozana sana kuhusu maisha ya baadaye](romantic_conflict) mpaka sasa hatujui kama uhusiano wetu una mwelekeo mzuri
      - [Migogoro yangu na mpenzi wangu](romantic_conflict) imekuwa mingi kiasi kwamba sasa tunazungumza mara kwa mara kuhusu kuvunja uhusiano
      - [Ninahisi kama mimi na mpenzi wangu hatuwezi kuafikiana kuhusu mambo muhimu](romantic_conflict) kama ndoa na watoto, na hilo linatishia uhusiano wetu
      - [Tuna ugomvi mkubwa kwa sababu mpenzi wangu hana uhakika](romantic_conflict) kama anataka kuwa katika mahusiano ya muda mrefu
