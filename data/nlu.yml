  - intent: financial_struggles
    examples: |
      - Hali yangu ya kifedha imekuwa mbaya sana.
      - [Hali yangu ya kifedha](financial_status) inanipa stress kila siku.
      - Sina pesa hata kidogo, sijui nitafanya nini.
      - Kila siku napambana lakini bado hali ya [fedha](financial_status) inazidi kuwa ngumu.
      - Nimechoka na [hali yangu ya kifedha](financial_status), sijui pa kuanzia tena.
      - Naishi kwa shida kwa sababu sina [kipato cha uhakika](income_source).
      - Sina [kazi ya kudumu](income_source), maisha yanakuwa magumu zaidi.
      - Hakuna njia ya kupata [kipato](income_source), nimejaribu kila kitu.
      - Nimehangaika [kutafuta pesa](income_source) lakini sipati njia yoyote.
      - [Mshahara wangu](income_source) hautoshi hata kugharamia mahitaji ya kila siku.

      # Money & Expense Struggles
      - Sina hata [senti](money) ya kununua [chakula](expense_type) leo.
      - [Maisha yanazidi kuwa magumu](life_struggle) kila siku, sijui nifanye nini.
      - [Vitu muhimu](expense_type) vinazidi kuwa ghali, siwezi kuvimudu.
      - Sijui nitalipia [ada ya shule](expense_type) ya watoto wangu vipi.
      - Sina pesa ya kulipia [bima ya afya](expense_type), naogopa nikiugua sitapata matibabu.
      - Nimeshindwa kulipa [kodi ya nyumba](expense_type), mwenye nyumba anataka kunifukuza.
      - Gharama za maisha zimepanda, lakini [kipato changu](income_source) hakibadiliki.

      # Job & Income Challenges
      - Sina [kazi](income_source) wala [biashara](income_source), hali yangu ni mbaya sana.
      - Nimetuma maombi ya [ajira](income_source) mara nyingi lakini sijapata jibu.
      - Hakuna [nafasi za kazi](income_source) huku, sijui nitawezaje kuishi.
      - [Mshahara](income_source) ninaopata ni mdogo sana hauwezi kukidhi mahitaji yangu.
      - Nilikuwa na [biashara ndogo](income_source) lakini haifanyi vizuri siku hizi.
      - Sina [kazi ya kudumu](income_source), na ajira za muda hazitoshi kulipa gharama zangu.

      # Debt & Loan Problems
      - Nina [madeni](debt) mengi, sijui nitawezaje kulipa yote.
      - [Mikopo](debt) inanibana, sijui nifanye nini.
      - Nimechukua [deni](debt) ili nipate [chakula](expense_type), lakini sina cha kulipa.
      - Kila mtu [ananidai](debt) lakini sina cha kuwalipa.
      - [Benki](institution) imenikatalia [mkopo](debt) kwa sababu sina dhamana yoyote.
      - [Taasisi za kifedha](institution) haziniamini kwa mikopo.
      - [Mikopo ya benki](debt) ina riba kubwa sana siwezi kulipa.
      - Bei ya [pesa za mkopo](debt) imekuwa ghali mno.
      - Nilikuwa na [mkopo wa biashara](debt) lakini umenilemea, siwezi kulipa tena.

      # Capital & Business Start-Up Issues
      - Nataka kuanzisha biashara lakini sina [mtaji wa kuanzia](capital).
      - Sijapata mtu wa kunisaidia kupata [mtaji](capital) wa biashara.
      - Siwezi kupata [dhamana ya mkopo](capital) ya kuanzisha biashara.
      - Nimejaribu kuomba msaada kutoka [serikali](institution) lakini sijapata jibu.
      - [Kila biashara](income_source) ninayoanzisha inaanguka kwa sababu ya ukosefu wa [mtaji](capital).

      # Family & Dependents Struggles
      - Ningependa kusaidia [familia yangu](support_dependents) lakini sina njia ya kupata [pesa](money).
      - Nina watoto wa kuwatunza lakini [kipato](income_source) changu hakitoshi.
      - Kila siku [watoto wangu](support_dependents) wanahitaji [chakula](expense_type) lakini sina pesa ya kununua.
      - Ningependa kuwasomesha [ndugu zangu](support_dependents) lakini sina [ada yao](expense_type).
      - [Mke wangu](support_dependents) anategemea mimi lakini sina [kazi](income_source) wala [kipato](income_source).
      - [Sina uwezo wa kuwasaidia](life_struggle) [wazazi wangu](support_dependents) [kifedha] kama nilivyopanga.

      # Economic & Life Challenges
      - [Hali ya uchumi ni mbaya](financial_status), kila kitu kinazidi kuwa ghali.
      - Nilipoteza kazi yangu ghafla na sasa sina chanzo cha [mapato](income_source).
      - Nina wasiwasi kuhusu kesho kwa sababu sina hakika nitaweza kupata chakula.
      - [Mahitaji yangu](expense_type) yameongezeka lakini [kipato changu](income_source) kimebaki pale pale.
      - [Nawaza kuhamia kijijini](life_event) kwa sababu maisha mjini yamekuwa ghali kupita kiasi.
      - Nimelazimika kuhama nyumba kwa sababu siwezi kulipa [kodi](expense_type).
      - Nimejaribu kuweka akiba lakini kila mara napata [dharura](expense_type) inayonilazimisha kutumia.

  - intent: academic_pressure
    examples: |
      - Ninajitahidi kusoma kwa bidii lakini bado [sipati alama nzuri](bad_grade).
      - [Walimu wangu](pressure_source) wanatarajia nifanye vizuri kila wakati, [inanilemea sana](education_difficulty).
      - Mimi ni [mwanafunzi wa mwisho](position) wa darasa langu, [nahisi nimekata tamaa](emotion).
      - Ninalazimika kupata [alama za juu](good_grade) ili kupata [udhamini wa masomo](achievement_goal).
      - [Familia yangu](pressure_source) inatarajia niwe [mwanafunzi bora](achievement_goal), lakini ni [vigumu kufanikisha](education_difficulty) hilo.
      - Ninahisi kuwa [masomo yangu](school_task) ni magumu sana na [siwezi kuyamudu](education_difficulty).
      - Nimepata [matokeo mabaya](bad_grade) na sasa [nahofia adhabu](emotion) kutoka kwa [wazazi wangu](pressure_source).
      - Nataka kushinda [shindano la kitaaluma](achievement_goal) lakini ushindani ni mkubwa sana.
      - Sina muda wa kupumzika kwa sababu ya [masomo mengi](school_task) na [kazi za nyumbani](home_task).
      - Ninajisikia vibaya [ninaposhindwa kuelewa](education_difficulty) [somo](subject) wakati wenzangu wanaelewa haraka.
      - Nina [mtihani mkubwa](exam_type) [wiki ijayo](time_frame), lakini [sijajiandaa vya kutosha](education_difficulty).
      - Mimi hupata [msongo wa mawazo](emotion) kabla ya [mitihani](exam_type), siwezi hata kulala vizuri.
      - Nikishindwa [mtihani huu](exam_type), nitarudia darasa, na hiyo [inanitia hofu](emotion).
      - Sina muda wa kujifunza kwa sababu ya [masomo mengi yanayofuatana](school_task).
      - [Mitihani](exam_type) ni mingi sana kwa [wakati](time_frame) ni kidogo, sijui nianze na ipi.
      - Napata [msongo mkubwa wa mawazo](emotion) kila ninaposikia kuhusu [mitihani ya taifa](exam_type).
      - Ninahisi sina kumbukumbu nzuri ya kukariri mambo yote ya [mtihani](exam_type).
      - [Wazazi wangu](pressure_source) wamesema ni lazima nipate [alama za juu](good_grade) ama [alama za kati](good_grade), la sivyo nitafukuzwa shule.
      - [Mitihani ya [hesabu](subject)](exam_type) [inanilemea sana](education_difficulty), nahisi kama sitaweza kufaulu.
      - Nilisoma sana kwa ajili ya [mtihani](exam_type), lakini [matokeo yangu bado ni mabaya](bad_grade).
      - Nina [kazi nyingi za nyumbani](home_task) lakini muda wa kuzifanya ni [mfupi sana](time_frame).
      - [Mradi wangu wa shule](school_task) unahitajika [kesho](time_frame), lakini bado sijamaliza.
      - [Mwalimu wetu](pressure_source) anatoa [majukumu mengi sana](school_task) na hatupati nafasi ya kupumzika.
      - [Najisikia vibaya](emotion) kwa sababu sikumaliza [kazi ya shule](school_task) kwa wakati.
      - Kuna [andiko](school_task) ninalohitaji kuandika lakini sijui nitapata wapi muda wa kulikamilisha.
      - Ninalazimika kufanya kazi [usiku kucha](time_frame) ili kukamilisha [kazi ya shule](school_task).
      - [Kazi ya makundi](school_task) inanilemea kwa sababu [wanakikundi wengine](pressure_source) hawashiriki.
      - [Mwalimu wangu](pressure_source) hanikubalii kuwasilisha [kazi](school_task) kwa kuchelewa hata kidogo.
      - Nilisahau [tarehe ya mwisho](time_frame) ya kuwasilisha [kazi yangu](school_task), sasa nina [wasiwasi mkubwa](emotion).
      - [Wanafunzi wengine](person_compared_to) darasani wanaonekana kuwa na akili sana kuliko mimi.
      - [Rafiki yangu](person_compared_to) [anafanya vizuri](good_grade) zaidi yangu, nahisi kama mimi si mwerevu.
      - [Shule yangu](pressure_source) inasisitiza ushindani mkubwa wa kitaaluma, inanifanya nihisi [presha](emotion).
      - Nataka kuwa [mwanafunzi bora wa darasa](achievement_goal), lakini wengine ni bora zaidi.
      - Ninajilinganisha na [wengine](person_compared_to) kila mara na [najihisi kama sifai](emotion).
      - [Wazazi wangu](pressure_source) wanalinganisha matokeo yangu na ya [kaka yangu](person_compared_to) kila mara.
      - Najisikia vibaya nikiona [wenzangu](person_compared_to) wanafanikiwa zaidi katika [masomo](school_task) kuliko mimi.
      - [Walimu](pressure_source) wanawapongeza [wanafunzi wengine](person_compared_to) tu, [ninahisi kama sipendwi](emotion).
