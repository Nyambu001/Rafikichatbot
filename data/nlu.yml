      - [Wanafunzi wengine](person_compared_to) wanaonekana kama wao hawasumbuki hata kidogo.
      - Najisikia kama [mimi tu ndiye ninayepitia haya](emotion).
      - [Mwalimu wangu](pressure_source) hunishusha moyo kila mara ninapojaribu kuelewa [somu gumu](subject).
      - Nilijaribu kuuliza msaada lakini [walimu](pressure_source) hawakunisaidia.
      - Nilishindwa [mtihani wa mwisho](exam_type) na sasa [nahisi sina matumaini](emotion).
      - [Kaka yangu](person_compared_to) alipata alama nzuri na [wazazi](pressure_source) wanalinganisha matokeo yetu kila mara.
      - Ninahisi kama hakuna mtu anayeona [jitihada zangu](emotion) katika [masomo](school_task).
      - Ninaandika [ripoti](school_task) ambayo inahitaji muda mwingi lakini nina [muda mchache](time_frame).
      - Najitahidi kuzingatia [ratiba yangu ya kujifunza](school_task) lakini [najikuta nimechoka](emotion) mara kwa mara.
      - Nimechelewa kufanya [kazi ya nyumbani](school_task) kwa sababu ya [shughuli nyingi](school_task) shuleni.
      - Ninahisi nimeelemewa na [majukumu ya shule](school_task) na [matarajio ya wazazi](pressure_source).
      - [Mtihani wa hesabu](exam_type) unanikosesha usingizi kila [usiku](time_frame).
      - [Muda wa kupumzika](time_frame) umekuwa mgumu kupata kwa sababu ya [masomo mengi](school_task).
      - Ninajiona kama [sifai kuwa katika shule hii](emotion).
      - [Wazazi wangu](pressure_source) hawajui presha ninayopitia kwa sababu ya [masomo](school_task).
      - Wakati mwingine natamani ningekuwa [mtu mwingine](person_compared_to) ambaye hana [shida hizi za kitaaluma](emotion).
