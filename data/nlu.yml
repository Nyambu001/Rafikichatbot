version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Vipi?
      - Salama?
      - Mambo vipi?
      - Habari
      - Niaje?
      - Mambo safi?
      - Shikamoo
      - Vipi leo?

  - intent: goodbye
    examples: |
      - Kwaheri rafiki
      - Tutaonana baadaye
      - Badaaye
      - Kwaheri
      - Nimechoka, nenda salama
      - Tutaonana kesho
      - Niko na safari, nitatoka sasa
      - Nenda salama, usisahau kunipigia simu


  - intent: emotional_support
    examples: |
      - Nahitaji mtu wa kunisikiliza
      - Niko peke yangu, na najisikia vibaya
      - Je, unaweza kunisaidia kujiweka sawa?
      - Nahitaji usaidizi wa kihemko
      - Niko na huzuni na sina mtu wa kuzungumza naye
      - Nitawezaje kushughulikia huzuni yangu?
      - Je, kuna mtu anayeweza kunisadia kuzungumza kuhusu hisia zangu?

  - intent: inquire_about_therapy
    examples: |
      - Je, ni vipi kuanza matibabu?
      - Nahitaji taarifa kuhusu tiba ya akili
      - Je, kuna aina tofauti za matibabu?
      - Naweza kupata mtaalamu wa akili wapi?
      - Niko na wasiwasi kuhusu matibabu, je, ni rahisi?
      - Je, ni kiasi gani cha pesa kinahitajika kwa matibabu?
      - Ni vipi nitaweza kueleza matatizo yangu kwa mtaalamu?

  - intent: share_experience
    examples: |
      - Nilipitia kipindi kigumu mwaka jana
      - Nilijaribu kujiua zamani
      - Nimepata shida na wasiwasi wa kila siku
      - Nilijaribu kutafuta msaada, lakini nikaishia peke yangu
      - Nimehisi hisia tofauti katika kipindi hiki
      - Nimekuwa na changamoto nyingi na sijui ni wapi nianzie
      - Nahisi ni vigumu kushughulikia mambo ya zamani

  - intent: fear_of_failure
    examples: |
      - Nahisi kama nitaweza kufeli
      - Sina uhakika kama naweza kufanikiwa
      - Ninajihisi kama sitoweza kutimiza malengo yangu
      - Ninapata wasiwasi kuhusu kujaribu vitu vipya
      - Naweza kufanya nini ili kuwa na ujasiri zaidi?
      - Ninahisi shinikizo kubwa la kufanikiwa
      - Je, kuna njia za kushinda hofu hii?


  - intent: personal_growth
    examples: |
      - Nataka kuboresha maisha yangu
      - Niko katika safari ya kujifunza zaidi kuhusu nafsi yangu
      - Je, kuna njia za kujiendeleza?
      - Nahitaji kujiimarisha kimwili na kiakili
      - Ni vipi naweza kuboresha uhusiano wangu na nafsi yangu?
      - Naweza kujiwekea malengo ya kuboresha afya yangu ya akili?
      - Nahisi nataka kubadilika, nifanyeje?

  - intent: mindfulness_techniques
    examples: |
      - Naweza kufanya nini ili kuwa na akili wazi?
      - Je, kuna mazoezi ya kufikiria yanayoweza kusaidia?
      - Naweza kujifunza kuhusu kujitenga na mawazo mabaya?
      - Je, kuna njia za kuwa na mtazamo chanya?
      - Ninahitaji mazoea ya kupumzika na kutafakari
      - Naweza kujaribu mazoezi ya kupumua vipi?
      - Je, kuna njia rahisi za kuwa na mtazamo wa kutafakari?

  - intent: work_related_stress
    examples: |
      - Kazi inanitia wasiwasi
      - Sijui jinsi ya kushughulikia msongo wa kazi
      - Ninapohisi shinikizo kazini
      - Nahisi kukosa motisha kazini
      - Je, kuna njia za kupunguza msongo wa kazi?
      - Niko na hofu kuhusu kupoteza kazi yangu
      - Naweza vipi kujihudumia wakati wa shinikizo la kazi?

  - intent: family_concerns
    examples: |
      - Nina wasiwasi kuhusu [kaka yangu](family_relationship)
      - [Mzee wangu](family_relationship) anahitaji msaada wa kiakili
      - Je, naweza kumsaidia [ndugu yangu](family_relationship)?
      - Nina [wasiwasi](emotion) kuhusu afya ya akili ya [mama yangu](family_relationship)
      - Nahisi kuna [matatizo](stressor) ya [kifamilia](family_relationship) yanayonisumbua
      - Je, kuna njia za kusaidia familia yangu?
      - Niko wapi naweza kupata msaada kwa [familia yangu](family_relationship)?


  - intent: life_changes
    examples: |
      - [Nimehamia mahali mpya](life_event), nahisi huzuni
      - [Nimepoteza kazi yangu](life_event), najisikia kupoteza mwelekeo
      - Nilivunjika moyo baada ya kumaliza uhusiano wangu
      - Hali yangu ya kifedha inanitisha
      - Nawezaje kushughulikia mabadiliko ya maisha?
      - Hali yangu ya afya imebadilika na najisikia vibaya
      - Je, kuna njia za kushughulikia mabadiliko makubwa?

  - intent: substance_abuse
    examples: |
      - Niko na shida ya matumizi ya pombe
      - Je, pombe inaathiri vipi afya yangu ya kiakili?
      - Nahisi matumizi ya madawa ya kulevya yananihangaisha
      - Najaribu kuacha pombe, nifanyeje?
      - Nimekuwa nikitumia madawa ya kulevya na sijui nitaje
      - Naweza kupata msaada wa kuacha matumizi ya madawa ya kulevya?

  - intent: Financial_struggles
    examples: |
      -Ninapitia muda mgumu kifedha