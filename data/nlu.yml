      - [Nahisi kuchoka sana](emotion) kwa sababu ya [ratiba yangu yenye shughuli nyingi za kitaaluma](school_task).
      - Najisikia vibaya kwa sababu [nahisi sifanyi vya kutosha](emotion) kuelekea [malengo yangu ya masomo](achievement_goal).
      - Kila [muda](time_frame) ninapofikiria kuhusu [matokeo ya mtihani](exam_type), napata [msongo wa mawazo](emotion).
