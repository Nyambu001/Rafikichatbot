version: "3.1"

rules:

- rule: Respond to greeting
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye when the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye


- rule: give assessment
  steps:
    - intent: submit_assessment
    - action: action_handle_assessment

- rule: Respond to stress
  steps:
    - intent: stress
    - action: action_stress_advice
    - action: utter_offer_stress_tips
    - action: action_listen

- rule: Respond to loneliness
  steps:
    - intent: loneliness
    - action: action_loneliness
    - action: utter_offer_loneliness_tips
    - action: action_listen