    - action: utter_define_peer_pressure

- story: User asks about effects of peer pressure
  steps:
    - intent: effects_of_peer_pressure
    - action: utter_effects_of_peer_pressure

- story: Peer pressure with entity - situation
  steps:
  - intent: peer_pressure
    entities:
      - situation: "marafiki wananishinikiza"
  - slot_was_set:
    - situation: "marafiki wananishinikiza"
  - action: utter_peer_pressure

- story: Peer pressure with multiple entities
  steps:
  - intent: peer_pressure
    entities:
      - person: "rafiki yangu"
      - emotion: "nina huzuni"
      - action: "kunywa pombe"
  - slot_was_set:
    - person: "rafiki yangu"
    - emotion: "nina huzuni"
    - action: "kunywa pombe"
  - action: utter_peer_pressure




